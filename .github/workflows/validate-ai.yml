name: Validate AI-generated code

on:
  pull_request:
    paths:
      - "**/*.tsx"
      - "**/*.ts"
      - "**/*.vue"

jobs:
  validate:
    name: Check for hallucinated useVyre props
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate useVyre props
        # Why this and not `npx @usevyre/validate-ai-context`:
        #
        # `npx`/`pnpm exec` inside a pnpm workspace doesn't reinstall a
        # package the workspace already provides locally — and `pnpm
        # install` doesn't link the unscoped `validate-ai-context` bin
        # into `node_modules/.bin/` for internal `workspace:*` consumers,
        # so the shell can't find the command and CI exits 127. (This
        # was the original failure 2026-05-19, and resurfaced when we
        # widened the scan path.)
        #
        # Invoking the bin directly avoids the resolution problem AND
        # makes CI test the validator code IN THE PR, not the one
        # already published — important because we publish *after*
        # merging, and a regression in validator.js should fail this
        # check before it ships, not after.
        #
        # Scans the docs site (real useVyre usage) and the eval fixtures
        # whose correctness the harness already guards.
        run: node packages/validate-ai-context/bin/cli.js apps/docs/src eval/fixtures/with-context --json
        # Exits non-zero if hallucinated props are found.
