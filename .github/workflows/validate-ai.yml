name: Validate AI-generated code

on:
  pull_request:
    paths:
      - "**/*.tsx"
      - "**/*.ts"
      - "**/*.vue"

jobs:
  validate:
    name: Check for hallucinated useVyre props
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate useVyre props
        run: npx @usevyre/validate-ai-context src/ --json
        # Exits with code 1 if hallucinated props are found.
        # Remove --json to get human-readable output instead.
