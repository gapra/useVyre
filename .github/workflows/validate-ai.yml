name: Validate AI-generated code

on:
  pull_request:
    paths:
      - "**/*.tsx"
      - "**/*.ts"
      - "**/*.vue"

jobs:
  validate:
    name: Check for hallucinated useVyre props
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate useVyre props
        # `npx <pkg>` resolves a bin named after the package; the bin here is
        # unscoped (`validate-ai-context`), so `-p <pkg> <bin>` is required.
        # Scans the docs site (real useVyre usage) and the eval fixtures
        # whose correctness the harness already guards.
        run: npx -p @usevyre/validate-ai-context validate-ai-context apps/docs/src eval/fixtures/with-context --json
        # Exits non-zero if hallucinated props are found.
